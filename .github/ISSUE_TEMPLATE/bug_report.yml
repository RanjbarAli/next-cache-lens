name: Bug report
description: Report reproducible incorrect behavior
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, cached values, cookies, authorization headers, or private user data.
  - type: input
    id: package-version
    attributes:
      label: Next Cache Lens version
    validations:
      required: true
  - type: input
    id: next-version
    attributes:
      label: Next.js version
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
    validations:
      required: true
  - type: dropdown
    id: custom-handler
    attributes:
      label: Are custom cache handlers configured?
      options: ['No', 'Yes']
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Relevant sanitized configuration
      render: typescript
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Link to a repository or provide exact sanitized steps.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
